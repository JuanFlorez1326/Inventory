version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: inventory_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: inventory_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - inventory_network

  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    container_name: api_gateway
    ports:
      - "3100:3000"
    depends_on:
      - postgres
      - products-service
    environment:
      - NODE_ENV=development
      - PRODUCTS_SERVICE_HOST=products-service
      - PRODUCTS_SERVICE_PORT=3001
    networks:
      - inventory_network
    volumes:
      - .:/app
      - /app/node_modules

  products-service:
    build:
      context: .
      dockerfile: Dockerfile.products
    container_name: products_service
    ports:
      - "3001:3001"
    depends_on:
      - postgres
    environment:
      - NODE_ENV=development
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgres
      - DB_DATABASE=inventory_db
    networks:
      - inventory_network
    volumes:
      - .:/app
      - /app/node_modules

volumes:
  postgres_data:

networks:
  inventory_network:
    driver: bridge
